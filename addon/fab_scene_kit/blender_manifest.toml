schema_version = "1.0.0"
id = "fab_scene_kit"
version = "0.4.1"
name = "FAB Scene Kit"
tagline = "Assemble consistent isometric FAB illustrations offline"
maintainer = "FAB Scene Kit"
type = "add-on"
tags = ["3D View", "Object", "Scene"]
blender_version_min = "4.3.0"
license = ["SPDX:GPL-3.0-or-later"]
[permissions]
files = "Read assets and authoring briefs; save JSON, local assets, scenes and renders"
[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc", "*.blend1", "*.zip"]
